<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('ip_theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar na sua Conta | Infinity Parts</title>
<meta name="description" content="Acesse sua conta Infinity Parts para acompanhar pedidos, favoritos e dados pessoais.">
<link rel="icon" href="assets/icons/favicon-256.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container header-main">
    <a href="index.html" class="logo"><img src="assets/icons/logo-infinity.png" alt="Infinity Parts" class="logo-mark"><span class="logo-text">INFINITY<span>PARTS</span></span></a>
    <div style="flex:1;"></div>
    <div class="header-actions">
      <a href="carrinho.html" class="header-action"><i class="bi bi-cart3"></i><span>Carrinho</span><span class="action-badge" id="cart-count">0</span></a>
    </div>
  </div>
</header>

<main>
  <div class="container" style="padding: 60px 0 90px;">
    <div class="auth-wrapper">
      <h1>Entrar na sua conta</h1>
      <p class="auth-sub">Acesse pedidos, favoritos e seus dados</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">ENTRAR</button>
      </form>

      <div class="auth-links">
        <a href="#" onclick="showToast('Um link de recuperação foi enviado (demonstração).'); return false;">Esqueci minha senha</a>
        <span class="auth-divider">ou</span>
        <a href="cadastro.html">Criar conta</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" style="margin-top:0;">
  <div class="container footer-bottom" style="border-top:none;">
    <span>&copy; <span class="current-year">2026</span> Infinity Parts. Todos os direitos reservados.</span>
  </div>
</footer>

<button class="theme-toggle solo" id="theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
  <span class="theme-track">
    <i class="bi bi-sun-fill theme-icon-sun"></i>
    <i class="bi bi-moon-stars-fill theme-icon-moon"></i>
    <span class="theme-thumb"></span>
  </span>
</button>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/account.js"></script>
</body>
</html>
